<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TANBIR CODEX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#101820;--card:#182532;--text:#fff;--muted:#a9b7c4;--blue:#2383cd;--green:#65a960;--red:#b54144;--line:#263746}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:18px 14px 30px}
.wrap{max-width:520px;margin:auto}.brand{text-align:center;margin:8px 0 20px}.brand h1{margin:0;font-size:27px}.brand p{margin:6px 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;color:white;font-size:16px;font-weight:700;padding:18px 12px;border-radius:18px;min-height:66px;box-shadow:0 5px 14px #0004;cursor:pointer}.blue{background:var(--blue)}.green{background:var(--green)}.red{background:var(--red)}.dark{background:#253443}.wide{grid-column:1/-1}.section{font-size:14px;color:var(--muted);margin:20px 4px 9px}.hidden{display:none}.back{margin-top:16px;background:#253443}.pkg{font-size:14px;min-height:62px}.small{font-size:12px;font-weight:500;opacity:.9}
</style></head>
<body><div class="wrap">
<div class="brand"><h1>𝐓𝐀𝐍𝐁𝐈𝐑 𝐂𝐎𝐃𝐄𝐗</h1><p>Free Fire Service Menu</p></div>
<div id="main" class="grid">
<button class="btn blue" onclick="openPage('guild')">🎮<br>FF GUILD GOLORY</button>
<button class="btn green" onclick="openPage('uid')">💎<br>UID TopUp Bd</button>
<button class="btn red" onclick="openPage('wm')">📅<br>Weekly / Monthly</button>
<button class="btn dark" onclick="send('payment')">💳<br>Payment</button>
<button class="btn dark" onclick="send('orders')">📦<br>My Orders</button>
<button class="btn dark" onclick="send('channel')">📢<br>Update Channel</button>
<button class="btn wide blue" onclick="send('owner')">📞 Contact Owner</button>
</div>
<div id="guild" class="hidden"><div class="section">FF GUILD GOLORY PACKAGES</div><div id="guildGrid" class="grid"></div><button class="btn back wide" onclick="home()">← Back</button></div>
<div id="uid" class="hidden"><div class="section">UID TOPUP BD</div><div id="uidGrid" class="grid"></div><button class="btn back wide" onclick="home()">← Back</button></div>
<div id="wm" class="hidden"><div class="section">WEEKLY / MONTHLY</div><div id="wmGrid" class="grid"></div><button class="btn back wide" onclick="home()">← Back</button></div>
</div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const guild=[['4 BOT','200 TK','guild_4'],['8 BOT','400 TK','guild_8'],['12 BOT','600 TK','guild_12'],['16 BOT','800 TK','guild_16'],['20 BOT','1000 TK','guild_20']];
const uid=[['25 Diamond','18 TK','uid_25'],['50 Diamond','34 TK','uid_50'],['115 Diamond','69 TK','uid_115'],['240 Diamond','160 TK','uid_240'],['355 Diamond','235 TK','uid_355'],['480 Diamond','300 TK','uid_480'],['610 Diamond','370 TK','uid_610'],['850 Diamond','520 TK','uid_850'],['1090 Diamond','630 TK','uid_1090'],['1240 Diamond','700 TK','uid_1240'],['2530 Diamond','1400 TK','uid_2530'],['5060 Diamond','2720 TK','uid_5060'],['Level Up Pass','162 TK','uid_level'],['Weekly','159 TK','uid_weekly'],['Monthly','700 TK','uid_monthly']];
const wm=[['Weekly','158 TK','wm_weekly'],['weekly lite','45 TK','wm_weekly_lite'],['Monthly','790 TK','wm_monthly'],['2X Weekly','316 TK','wm_2x_weekly'],['3X Weekly','474 TK','wm_3x_weekly'],['5X Weekly','790 TK','wm_5x_weekly'],['2X Monthly','1580 TK','wm_2x_monthly'],['1Weekly + 1Monthly','948 TK','wm_1weekly_1monthly'],['4Weekly + 1Monthly','1422 TK','wm_4weekly_1monthly'],['2x weekly lite','90 TK','wm_2x_weekly_lite'],['3x weekly lite','135 TK','wm_3x_weekly_lite'],['5x Weekly Lite','225 TK','wm_5x_weekly_lite']];
function render(id,data){document.getElementById(id).innerHTML=data.map((x,i)=>`<button class="btn pkg ${i%3===0?'blue':i%3===1?'green':'red'}" onclick="send('${x[2]}')">${x[0]}<br><span class="small">${x[1]}</span></button>`).join('')}
render('guildGrid',guild);render('uidGrid',uid);render('wmGrid',wm);
function send(action){tg?.sendData(JSON.stringify({action})); setTimeout(()=>tg?.close(),80)}
function openPage(id){document.getElementById('main').classList.add('hidden');['guild','uid','wm'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function home(){document.getElementById('main').classList.remove('hidden');['guild','uid','wm'].forEach(x=>document.getElementById(x).classList.add('hidden'))}
</script></body></html>
